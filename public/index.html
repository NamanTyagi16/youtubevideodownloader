<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clipper - Professional Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="bg-red-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold tracking-tight">YouTube Clipper</h1>
            <p class="text-red-100 mt-2 text-sm">Extract high-quality clips without downloading the full video.</p>
        </div>
        
        <div class="p-8">
            <form id="clipForm" class="space-y-5">
                <!-- Video URL -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">YouTube Video URL</label>
                    <input type="url" id="videoUrl" required placeholder="https://www.youtube.com/watch?v=..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all">
                </div>

                <!-- Timestamps -->
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Start Time</label>
                        <input type="text" id="startTime" required placeholder="00:01:30" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none transition-all font-mono text-center">
                        <p class="text-xs text-gray-500 mt-1 text-center">HH:MM:SS</p>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">End Time</label>
                        <input type="text" id="endTime" required placeholder="00:02:00" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 outline-none transition-all font-mono text-center">
                        <p class="text-xs text-gray-500 mt-1 text-center">HH:MM:SS</p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="downloadBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-lg shadow-lg hover:shadow-xl transition-all flex justify-center items-center gap-2 mt-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download Clip</span>
                </button>
            </form>
            
            <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg text-sm text-center font-medium"></div>
        </div>
    </div>

    <script>
        document.getElementById('clipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const url = document.getElementById('videoUrl').value.trim();
            const start = document.getElementById('startTime').value.trim();
            const end = document.getElementById('endTime').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('statusMessage');

            if(!url || !start || !end) return;

            // UI Loading state
            btn.innerHTML = '<span class="spinner"></span> <span>Extracting... Please wait</span>';
            btn.disabled = true;
            btn.classList.replace('bg-red-600', 'bg-red-400');
            
            status.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            status.classList.add('bg-blue-100', 'text-blue-700');
            status.innerHTML = 'Connecting to YouTube servers... This might take a few seconds.';

            // Since it downloads a file directly, the easiest way to handle it without ajax is navigating
            // However, to catch errors, we can try to fetch it first, or just open in a hidden iframe/new tab.
            
            const downloadUrl = `/clip?url=${encodeURIComponent(url)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
            
            // Navigate to the download URL. The browser will handle the file download.
            window.location.href = downloadUrl;

            // Reset UI after a few seconds assuming download prompt appeared
            setTimeout(() => {
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> <span>Download Another Clip</span>';
                btn.disabled = false;
                btn.classList.replace('bg-red-400', 'bg-red-600');
                
                status.classList.replace('bg-blue-100', 'bg-green-100');
                status.classList.replace('text-blue-700', 'text-green-700');
                status.innerHTML = '✅ Download started! Check your downloads folder.';
            }, 4000);
        });
    </script>
</body>
</html>
